","Não","Muito boas, porém cada vez aprendemos mais","Entender o próximo e partir disso tentar ajudar","A conferência de Chimamanda Adichie mostra que a \"história única\" reduz grupos inteiros a um único estereótipo incompleto, o que impede a verdadeira inclusão. Para incluir de fato, é preciso desconstruzir esses preconceitos, descentralizar o poder de fala e garantir a multiplicidade de vozes na sociedade.","","","","","","","","","","","1","0"],["Calypso","19.0","Mulher","Pedagogia","2°","Não","Não","o respeito às diferenças e a igualdade de oportunidades para todas as pessoas, indo além da simples presença física.","Respeito, inclusão,garantia de acesso universal, a valorização da diversidade e a adaptação do ambiente escolar para todas as pessoas.","O problema é que as pessoas querem tratar as pessoas com deficiência pela sua deficiência e não por quem ela é.","","","","","","","","","","","1","0"],["Carina","","","","","","","","","","Não, esta é a primeira vez.","20.0","Mulher","Pedagogia","4 período","Não","Não","Que a inclusão é um direito de todas as pessoas participar da educação e da sociedade respeitando suas diferenças e necessidades .","Respeito as diferenças , igualdade","O filme mostra como as diferenças podem gerar preconceito e exclusão , reforçando a importância de respeitar outras pessoas .","0","1"],["Cinderela","22 anos","Mulher","Pedagogia","2º período","Não","Sim, como auxiliar de professor","Um assunto muito importante e essencial em todo debate","Respeito, empatia","Sempre ver os dois lados da história e nao criar esteriótipos das pessoas","","","","","","","","","","","1","0"],["Clarisse","19.0","Mulher","Licenciatura em Matemática","Quarto período","Não","Não","É de extrema importância  não só para a formação de professores com também para o caráter de indivíduo.","Sim","Que apesar de todas as adversidades e problemas enfrentados todo e qualquer um pode ser o que quiser.","","","","","","","","","","","1","0"],["Daenerys","20 anos","Mulher","Pedagogia","6° período","Não","Não","Na minha concepção, inclusão significa garantir que todas as pessoas tenham as mesmas oportunidades de participação na sociedade, considerando suas diferentes necessidades e condições. Por isso, incluir não é apenas possibilitar o acesso a determinados espaços ou oportunidades, mas também assegurar que os direitos de cada pessoa sejam respeitados. Dessa forma, a inclusão está relacionada à equidade e à garantia de condições para que todos possam participar da sociedade de maneira plena.","É necessário que os direitos sejam efetivados, que haja equidade e principalmente respeito, uma vez que, nossas diferenças não nos fazem melhores ou piores que os outros.","Acredito que o ponto central que interliga a conferência e o tema inclusão, seja justamente o ponto que traz que não devemos ficar presos em uma única versão da história, pois isso limita demais a nossa forma de ver o mundo. É preciso mudar muitas vezes as nossas perspectivas, pois acabamos capacitando e determinando o que o outro pode fazer simplesmente pela sua diferença, mas o que não podemos esquecer é que cada um de nós compõe a sua história, e que não podemos generalizar as histórias como se elas sempre tivessem um mesmo caminho e uma mesma direção.","","","","","","","","","","","1","0"],["Darcy","21.0","Mulher","Pedagogia","2026.2","Não","Não","Inclusão é o ato de incluir os cidadãos de acordo com sua necessidades.","Ética","inclusão exige evitar estereótipos e reconhecer a diversidade.","","","","","","","","","","","1","0"],["Dora","23.0","Mulher","Pedagogia","2026.2","Letras vernáculas","Sim, professora da rede municipal","Que ainda é um processo, existem muitas teorias e ideias sobre, mas a prática não coincide com o que se é pensado.","Equidade","A questão de enxergar a perspectiva e realidade de outras pessoas.","","","","","","","","","","","1","0"],["Dorothy","20.0","Mulher","Administração","2026.2","Não","Não","Acredito que respeitar e garantir que todas as pessoas possam participar, não deixando ninguém de foraaa","Respeito, acessibilidade…","A criação de esteriótipos e preconceitos quando nos limitamos ou generalizamos","","","","","","","","","","","1","0"],["Elisa","","","","","","","","","","Não, esta é a primeira vez.","Ellen de Oliveira Sousa","Mulher","Pedagogia","Quarto período","Não","Sim, promotora de vendas.","Assunto interessante para debater sobre didática e inclusão, tendo em vista que todo filme apresentado mostra a total indiferença e mau trato com a protagonista e como isso é normalizado, o que foi dito tanto pelo prefessor quanto pela professora foi necessário, visto que foram claros e souberam fazer analogia ao filme sobre o assunto com fácil entendimento!\nTive muitos aprendizados.","Na minha opinião o princípio determinando é uma boa convivência, com respeito e diversidade.","A trajetória de exclusão da protagonista.","0","1"],["Eloá🌷","","","","","","","","","","Não, esta é a primeira vez.","19.0","Mulher","Pedagogia","2026.2","Não","Sim, auxiliar de sala","Para mim, inclusão é garantir que todas as pessoas tenham o direito de participar, aprender e conviver, respeitando suas diferenças e necessidades. Na educação, não é apenas colocar o aluno na escola, mas oferecer condições para que ele realmente participe e se desenvolva.","Respeito às diferenças, igualdade de oportunidades, valorização de cada aluno, acessibilidade, participação de todos e adaptação das práticas de ensino de acordo com as necessidades de cada pessoa. Também é importante combater o preconceito e promover um ambiente acolhedor.","O filme Wicked mostra como as pessoas podem ser julgadas e excluídas por serem diferentes. A história de Elphaba faz refletir sobre preconceito, padrões e sobre a importância de olhar para cada pessoa além daquilo que é considerado “normal”. Assim, podemos relacionar o filme com a inclusão, mostrando a necessidade de respeitar as diferenças e não excluir alguém por não se encaixar nos padrões da sociedade.","0","1"],["Elphaba","","","","","","","","","","Não, esta é a primeira vez.","42.0","Mulher","pedagogia","3.0","não","não","garantir que todos tenham acesso  aos mesmos direitos, oportunidades independente de suas características.","o acesso e a permanência na escola .","o preconceito,Elphaba sofria forte discriminação e isolamento por parte dos colegas e da própria direção ,devido o cor de sua pele que era verde.","0","1"],["Esmeralda","33.0","Mulher","Pedagogia","2.0","Não","Não","Necessário","Ser tratado principalmente pelo próprio nome","Inclusão escolar","","","","","","","","","","","1","0"],["Flora","20.0","Mulher","Matemática","4º","Não","Não","Tratar as pessoas com igualdade independente da sua especificidade","Buscar compreender as necessidades do aluno e ajuda-lo a se desenvolver","Não resumir o estudante apenas ao um diagnóstico e sim buscar entender as necessidades de cada um.","","","","","","","","","","","1","0"],["Freya","22.0","Mulher","Pedagogia","4.0","Não","Secretaria","Uma direção e uma oportunidade de ter oportunidade como todos","Respeito, determinação e visão a igualmente","Incluir é dar oportunidades de torna-se real e igual a todos. Na conferência ela informa diversas vezes que não teve essa recepção de ser inclusiva ao novo ambiente pela sua vida, suas características.","","","","","","","","","","","1","0"],["Gabriel","27.0","Homem","SI","4.0","Não","Não","Eu acredito que o processo de inclusão consiste em fazer com que pessoas que, estatisticamente, tenderiam a ser deixadas de lado possam fazer parte de determinado meio, seja ele um grupo, uma ação, um evento, uma instituição ou uma organização.\n\nExistem pessoas que, por diferentes motivos, acabam sendo excluídas ou deixadas de lado, principalmente quando possuem alguma demanda específica que exige adaptações. Atender a essas necessidades demanda esforço, recursos e mudanças e, muitas vezes, quando esse esforço não é realizado, essas pessoas acabam não conseguindo participar daquele meio.\n\nNesse sentido, o processo de inclusão é justamente dedicar esforços para garantir que essas pessoas não sejam deixadas de lado. É promover as adaptações necessárias para que elas possam ser inseridas e participar efetivamente de uma ação, evento, grupo, instituição ou organização.","A inclusão na educação também é um bom exemplo desse processo. Muitas vezes, um aluno que possui alguma demanda específica, independentemente de qual seja, pode acabar sendo deixado de lado tanto pelos próprios colegas quanto, de certa forma, pelos profissionais da educação.\n\nNa relação com os colegas, por exemplo, esse aluno pode ter dificuldade para se inserir naturalmente nos grupos de amizade. Talvez apresente algum comportamento ou alguma característica que não seja compreendida pelos demais, o que pode dificultar a interação e fazer com que ele seja afastado ou simplesmente não consiga fazer parte daquele meio da mesma maneira que os outros.\n\nAo mesmo tempo, pode existir uma demanda específica relacionada à própria aprendizagem. Esse aluno talvez precise de uma adaptação na forma como determinado conteúdo é apresentado, de uma atenção diferente ou de alguma mudança na metodologia de ensino para conseguir acompanhar a aula. Nesse caso, o professor precisa dedicar esforço para realizar essas adaptações e criar um ambiente com maior equidade. Ou seja, não necessariamente oferecer exatamente as mesmas condições para todos, mas oferecer condições que permitam que todos tenham a possibilidade de participar e aprender.\n\nEntretanto, adaptar o ensino resolve apenas uma parte do problema. Garantir que o aluno consiga acompanhar a aula não significa que ele estará automaticamente incluído socialmente. Ainda existe um trabalho a ser realizado pelo corpo docente em relação à convivência entre os próprios alunos.\n\nEssa conscientização também precisa ser conduzida com cuidado. A ideia não deveria ser fazer com que os colegas enxerguem aquele aluno simplesmente como “alguém que precisa ser acolhido porque possui uma demanda específica”. Isso poderia, inclusive, reforçar a percepção de que ele é diferente dos demais. O objetivo deveria ser criar condições para que ele seja percebido e tratado naturalmente como qualquer outro colega.\n\nNesse sentido, a inclusão acontece de maneira mais completa quando as adaptações necessárias existem, mas não passam a definir aquela pessoa. O ambiente reconhece e atende à demanda quando necessário, enquanto, nas relações sociais, ela deixa de ser uma barreira. Assim, amizades, conversas e interações podem acontecer de maneira mais espontânea e fluida, sem que a característica ou demanda específica daquele aluno determine o lugar que ele ocupa dentro do grupo.","É justamente nesse ponto que entra um dos desafios da inclusão. Como citei no exemplo da educação, muitas vezes uma necessidade ou demanda específica de um aluno passa a ser tratada como se fosse a própria identidade daquela pessoa. As demais características daquele indivíduo acabam sendo ignoradas, e aquela particularidade se transforma em uma espécie de “história única” sobre ele.\n\nNa conferência “O Perigo de uma História Única”, Chimamanda Ngozi Adichie discute justamente o perigo de reduzir pessoas, grupos ou lugares a uma única narrativa. Quando conhecemos alguém apenas por determinada característica e passamos a enxergá-lo exclusivamente a partir dela, ignoramos toda a complexidade que existe naquele indivíduo.\n\nIsso pode ser relacionado diretamente à inclusão. Uma pessoa que possui alguma necessidade específica, por exemplo, pode acabar sendo enxergada somente a partir dessa necessidade. Em vez de ser percebida como um indivíduo completo, ela passa a ser identificada pela característica que exige alguma adaptação ou atenção diferenciada. Pouco importa, nesse olhar, se ela gosta de música, de determinados filmes, de andar de bicicleta, quais são suas amizades, como é sua relação com a família ou quais são seus interesses e objetivos. Todas essas outras dimensões ficam ocultadas pela característica que mais chama a atenção das pessoas.\n\nÉ justamente aí que surge a “história única”: uma característica real daquela pessoa passa a representar tudo aquilo que ela é. O problema não está em reconhecer que existe uma demanda específica, pois ela pode precisar ser reconhecida para que sejam realizadas as adaptações necessárias. O problema surge quando essa demanda deixa de ser apenas uma das características do indivíduo e passa a definir socialmente quem ele é.\n\nPortanto, um dos desafios da inclusão é superar essa visão. Incluir não significa ignorar as necessidades específicas de alguém, mas reconhecê-las quando necessário sem reduzir a pessoa a elas. É conseguir enxergar o indivíduo para além daquilo que exige adaptação, compreendendo que sua identidade é formada por inúmeras características, experiências, relações, interesses e histórias.","","","","","","","","","","","1","0"],["Gamora","21.0","Mulher","Pedagogia","6° período","Não.","Sim, como auxiliar de PCD.","Eu compreendo que a disciplina de inclusão deveria ser obrigatória para que os professores possam atender todos os alunos com mais equidade.","Conhecer bem o estudante e suas potencialidades.","Olhar para a pessoa além do que ela é!","","","","","","","","","","","1","0"],["Gi","","","","","","","","","","Não, esta é a primeira vez.","20.0","Mulher","Pedagogia","4º","Não","Não","É uma temática muito importante, que deve ser abordada sempre.","Ter empatia, ter conhecimento, entender como a nossa sociedade é diversa.","O filme utiliza personagens fictícios para abordar como o preconceito acontece, de forma frequente e triste na sociedade contemporânea.","0","1"],["Ginny","20 anos","Mulher","Pedagogia","2 período","Não.","Não.","Importante para todos os cursos, principalmente para os cursos de licenciatura.","Respeito e empatia.","A autora fala sobre o perigo de uma história única, fazendo alusão com a inclusão, a importância é que para se ter inclusão necessita-se de olhar para questão com mais de uma perspectiva.","","","","","","","","","","","1","0"],["Girassol","20.0","Mulher","Pedagogia","Oitavo","Não","Sim. Em um colégio","Para mim, inclusão é garantir que todas as pessoas tenham os mesmos direitos e oportunidades, respeitando as diferenças de cada uma. Na educação, não basta apenas colocar o aluno na escola, é preciso fazer com que ele participe, aprenda e se sinta acolhido.","Acredito que o respeito, a igualdade, a valorização das diferenças e o acolhimento são muito importantes para uma educação inclusiva. A escola também precisa estar preparada para atender às necessidades dos diferentes alunos e garantir que todos possam aprender e participar.","Eu relacionaria a conferência com a inclusão porque Chimamanda mostra como conhecer apenas uma versão sobre uma pessoa ou grupo pode gerar estereótipos, preconceitos e exclusão. Na educação, isso também pode acontecer quando enxergamos um aluno apenas por uma característica, como sua deficiência, sua condição social, sua origem ou suas dificuldades de aprendizagem. A inclusão exige justamente um olhar mais amplo, que reconheça cada estudante em sua individualidade e não o reduza a uma única história.","Sim, já respondi.","20 anos","Mulher","Pedagogia","Oitavo período","Não","Auxiliar de sala","","","Wicked nos faz refletir que, muitas vezes, o problema não está na pessoa que é diferente, mas no preconceito de uma sociedade que não aceita as diferenças. A inclusão começa quando deixamos de julgar e passamos a respeitar, acolher e valorizar cada indivíduo.","1","1"],["Helia (JV)","19 anos","Homem","Química - Licenciatura","2026.2","Não","Não","Para mim, inclusão significa garantir que todas as pessoas tenham o direito de participar da sociedade, da educação e de outros espaços, independentemente de suas diferenças e necessidades. Entendo que incluir não é apenas permitir que a pessoa esteja presente, mas também oferecer condições e oportunidades para que ela realmente participe e se desenvolva. Dessa forma, a inclusão envolve respeito às diferenças, acessibilidade, igualdade de oportunidades e combate ao preconceito e à exclusão.","Na minha perspectiva, alguns princípios fundamentais para uma educação inclusiva são o respeito às diferenças, a igualdade de oportunidades, a valorização da diversidade e a acessibilidade. Também considero importante que a escola esteja preparada para atender às diferentes necessidades dos alunos, utilizando estratégias e recursos que favoreçam a participação e a aprendizagem de todos. Além disso, o combate ao preconceito e à discriminação é essencial para construir um ambiente acolhedor, respeitoso e inclusivo.","Pelo que entendi da ideia da conferência, uma “história única” pode fazer com que tenhamos uma visão limitada sobre uma pessoa ou grupo. Relacionando com a inclusão, acho que é importante conhecer e respeitar as diferentes histórias e realidades das pessoas, sem julgá-las por estereótipos.","","","","","","","","","","","1","0"],["Hermione","21.0","Mulher","Pedagogia","8º período","Não","Reforço Escolar","Inclusão é garantir que todas as pessoas tenham os mesmos direitos e oportunidades de participar da educação, respeitando suas diferenças, necessidades e características. É valorizar cada aluno e combater qualquer forma de preconceito ou exclusão.","Os princípios determinantes são o respeito às diferenças, a igualdade de oportunidades, a valorização da diversidade, a acessibilidade, a participação de todos e a garantia de uma aprendizagem de qualidade.","relaciona-se à inclusão porque mostra como conhecer apenas uma versão sobre uma pessoa ou grupo pode gerar preconceitos e estereótipos. Na educação inclusiva, é importante conhecer cada pessoa em sua diversidade, reconhecendo suas capacidades, histórias e experiências.","","","","","","","","","","","1","0"],["Icy","19.0","Mulher","Pedagogia","4.0","Não","Auxiliar de turma","Incluir a diversidade","Amor","A relação de pertencimento","","","","","","","","","","","1","0"],["Isa","","","","","","","","","","Não, esta é a primeira vez.","19.0","Mulher","Pedagogia","2026.2","não","não","Entendo a inclusão como garantir que todas as pessoas tenham o direito de participar e aprender, respeitando suas diferenças e necessidades","Respeito às diferenças, igualdade de oportunidades, acessibilidade, valorização de cada aluno e adaptação das práticas de ensino de acordo com as necessidades de cada um","O filme mostra como uma pessoa pode ser julgada e excluída por ser diferente dos outros. A história de Elphaba faz refletir sobre o preconceito, os padrões impostos pela sociedade e a importância de respeitar as diferenças, mostrando que ser diferente não significa ser inferior.","0","1"],["Jane","19.0","Mulher","Licenciatura em Matemática","Quarto período","Não","Não","Trata-se de acolher uma pessoa, fazer com que ela se sinta parte da sociedade sem qualquer tipo de discriminação, independente de suas características sejam elas físicas, sociais, entre outros.","Respeito, acolhimento e conhecer a pessoa fora do estereótipo de sua limitação.","Buscar conhecer histórias fora das perspectivas que a sociedade costuma trazer. Buscar conhecer as diferentes realidades dessas histórias.","","","","","","","","","","","1","0"],["Jasmine","49.0","Mulher","Pedagogia","4 período","Não","Não","A minha compreensão e aceitar as pessoas como ela são e tentar entender ela .","Ser mais compreensiva, se colocar no lugar da outra pessoa pra saber o que se passa com ela .","Não saberei responder","","","","","","","","","","","1","0"],["Joseph","","","","","","","","","","Não, esta é a primeira vez.","23.0","Homem","Física","Nono período","Não","Não","É algo que deveria ser mais relevante na sociedade atual, e esse tema permeia todas as áreas da sociedade.","Adaptação em todos os âmbitos da sociedade, respeito a diversidade e inclusão.","O preconceito que pessoas ditas diferentes sofrem na sociedade.","0","1"],["Jujuba","22.0","Mulher","Pedagogia","8° período","Não","Não","Minha compreensão sobre inclusão parte da ideia de que todas as pessoas têm o direito de participar plenamente da sociedade, independentemente de suas diferenças, características ou condições. Entendo que incluir não significa apenas permitir que alguém esteja presente em determinado espaço, mas criar condições para que essa pessoa participe de forma efetiva, seja respeitada, tenha voz, desenvolva suas potencialidades e sinta-se pertencente ao ambiente em que está inserida. Nesse sentido, a inclusão envolve o respeito às diferenças, a valorização da diversidade, a promoção da equidade e a eliminação de barreiras que possam dificultar a participação das pessoas. Também considero importante compreender que oferecer as mesmas condições para todos nem sempre é suficiente, pois algumas pessoas podem necessitar de recursos, adaptações ou apoios específicos para terem oportunidades realmente igualitárias. Dessa forma, a inclusão deve ser compreendida como um processo contínuo de transformação das relações, dos espaços e das práticas sociais, buscando combater o preconceito, a discriminação e qualquer forma de exclusão. Portanto, acredito que a inclusão é uma responsabilidade coletiva e que construir uma sociedade verdadeiramente inclusiva significa reconhecer e respeitar as diferenças, garantindo a todos dignidade, participação, oportunidades e pertencimento.","Na minha perspectiva, alguns princípios são fundamentais para a construção de uma educação verdadeiramente inclusiva, como o respeito à diversidade, a valorização das diferenças e a garantia de igualdade de oportunidades para todos os estudantes. É importante compreender que cada aluno possui suas próprias características, necessidades, ritmos e formas de aprender, sendo necessário desenvolver práticas pedagógicas flexíveis e acessíveis que favoreçam a participação e a aprendizagem de todos. Outro princípio determinante é a equidade, pois oferecer as mesmas condições não significa necessariamente garantir as mesmas oportunidades; muitas vezes, é preciso disponibilizar recursos, adaptações e apoios específicos para que cada estudante possa desenvolver seu potencial. Além disso, considero essencial a eliminação de barreiras físicas, pedagógicas, comunicacionais e atitudinais, bem como o combate ao preconceito e à discriminação. A educação inclusiva também depende do trabalho coletivo entre professores, gestores, famílias e comunidade escolar, construindo um ambiente acolhedor, democrático e que reconheça cada estudante como sujeito de direitos. Portanto, acredito que uma educação inclusiva deve garantir não apenas o acesso e a permanência na escola, mas também a participação, a aprendizagem e o sentimento de pertencimento de todos.","A conferência “O Perigo de uma História Única”, de Chimamanda Ngozi Adichie, apresenta uma relação muito forte com o tema da inclusão, principalmente porque nos faz refletir sobre os estereótipos e os preconceitos que podem surgir quando conhecemos uma pessoa ou um grupo apenas por meio de uma única narrativa. Adichie mostra que uma história única reduz a complexidade das pessoas, fazendo com que sejam vistas apenas por uma característica, condição ou experiência. Na educação, isso pode acontecer quando um estudante é definido apenas pela sua deficiência, condição social, origem, raça, cultura, dificuldade de aprendizagem ou qualquer outra característica. Essa visão limitada pode influenciar a forma como professores e colegas percebem suas capacidades e expectativas em relação a ele. \nNesse sentido, a inclusão exige que possamos enxergar cada estudante em sua totalidade, reconhecendo suas diferentes histórias, potencialidades, experiências e formas de aprender. Não basta colocar todos no mesmo espaço; é necessário criar oportunidades para que cada pessoa seja ouvida, respeitada e valorizada em sua singularidade. A conferência também nos faz pensar sobre a importância de uma educação que apresente diferentes culturas, perspectivas e experiências, evitando reproduzir estereótipos e preconceitos. Assim, romper com a “história única” significa ampliar o nosso olhar, valorizar a diversidade e compreender que nenhuma pessoa pode ser definida por uma única característica. Dessa forma, considero que a reflexão de Chimamanda contribui diretamente para uma educação mais inclusiva, democrática e humanizada, na qual as diferenças sejam reconhecidas como parte da riqueza da convivência e não como motivo para exclusão.","Sim, já respondi.","22.0","Mulher","Pedagogia","8º","Não","Não","","","O filme está ligado à inclusão em toda a sua premissa. Acompanhamos a personagem principal Elphaba sofrendo preconceito em toda a sua vida somente por ser verde. \n     No percorrer, vemos que ela é uma moça adorável e talentosa, e permanece sendo julgada. \n     No fim, ela entende que o mais importante é manter-se fiel a sua essência, e recusa mudar para encaixar-se nos padrões de Oz.","1","1"],["Juliano","25.0","Homem","Física","5 período","Não","Não","Entendo a inclusão como a garantia de que todas as pessoas tenham o direito de participar e aprender, independentemente de suas diferenças, necessidades ou condições.","Acredito que o respeito às diferenças, a igualdade de oportunidades, a acessibilidade, a empatia e a valorização de cada estudante são princípios fundamentais.","A conferência mostra como conhecer apenas uma história sobre uma pessoa ou grupo pode gerar estereótipos e preconceitos. Relacionando isso à inclusão, é importante compreender que cada pessoa possui uma história, experiências e necessidades diferentes.","","","","","","","","","","","1","0"],["Karlla","","","","","","","","","","Sim, já respondi.","20.0","Mulher","Pedagogia","3.0","Nao","Nao","","","No filme nos vemos o quão alfaba e ridicularizada por ser diferente, pela cor jeito de vestir jeito de ser entre outras coisas, isso nos vemos quase sempre no nosso dia a dia.","0","1"],["Katniss","21.0","Mulher","Pedagogia","2026.2","Não","Não","Entendo a inclusão como o direito de todas as pessoas participarem da educação e da sociedade, independentemente de suas diferenças, características ou necessidades.","Considero fundamentais os princípios de respeito à diversidade, equidade, igualdade de oportunidades, acessibilidade, valorização das diferenças e participação de todos.","A relação está principalmente na forma como construímos nossas percepções sobre o outro.","","","","","","","","","","","1","0"],["Kida","19.0","Mulher","Pedagogia","2 período","Não","Não","Importante a discussão, pra não existir a inclusão","Empatia, compreensão","Importante sempre observar o outro lado da história","","","","","","","","","","","1","0"],["L.F","","","","","","","","","","Sim, já respondi.","20.0","Mulher","Pedagogia","4° período","Não","","","","O filme traz relação com a inclusão ao retratar a forma como a Elphaba é rejeitada só por ter a pele verde virando o alvo de um julgamento injusto antes mesmo de ter a chance de mostrar quem realmente é. Acontece também com os animais de Oz, que vão perdendo a voz e os direitos, refletindo como o poder gosta de oprimir quem é minoria. Tem o olhar sensível sobre a deficiência e a superproteção através da Nessarose, e, no fim das contas, nos faz perceber que os rótulos de \"bom\" e \"mau\" quase sempre servem só para afastar quem o sistema não quer aceitar","0","1"],["Laís","","","","","","","","","","Não, esta é a primeira vez.","22.0","Mulher","Pedagogia","2026.2","Não","Não na minha área mas já trabalho","O processo de garantir que todas as pessoas tenham acesso, participação, respeito e oportunidades, independentemente de qualquer coisa","Respeito a diversidade; igualdade e equidade, acessibilidade, não descriminação, participação de todos…","Se relaciona com a inclusão porque mostra como Elphaba é julgada e excluída só por ser diferente e ser verde. A história aborda preconceito, diversidade, aceitação e respeito as diferenças, mostrando a importância de não julgar alguém pela aparência e nem por nada","0","1"],["Leia","18.0","Homem","Sistemas de Informação","Segundo","Não","Não","Inclusão é garantir que todas as pessoas tenham as mesmas oportunidades, respeitando suas diferenças e necessidades","Respeito as diferenças, igualdade de oportunidades, acessibilidade e participação de todos no processo de aprendizagem","relação está em evitar estereótipos e julgamentos. A inclusão reconhece que cada pessoa possui diferentes histórias, experiências e formas de ser","","","","","","","","","","","1","0"],["Lelê","","","","","","","","","","Não, esta é a primeira vez.","21 anos","Mulher","Pedagogia","4° período","Não","Não","Inserir alguém em um grupo ou lugar","Empatia e respeito","Claramente vemos que a escola X é excludente pois não acolhe alunos que sejam diferentes e determina uma única forma de ser para todos.","0","1"],["LF","20.0","Mulher","Pedagogia","4° período","Não","No momento não","Aceitar e respeitar as diferenças de cada um e refletir sobre a importância da diversidade.","Empatia, respeito, reciprocidade e acessibilidade.","Ele nos faz refletir bastante em como os estereótipos,  infelizmente, acabam definindo quem somos e a forma em que as pessoas devem ou não nos tratar.","","","","","","","","","","","1","0"],["Liz","21 anos","Mulher","Pedagogia","8° Período","Não","Não","Minha concepção de inclusão está relacionada à garantia de que todas as pessoas tenham seus direitos respeitados e possam participar de forma efetiva dos diferentes espaços da sociedade, independentemente de suas características, necessidades ou diferenças. Entendo que incluir não significa apenas permitir o acesso, mas também oferecer condições para que todos possam participar, aprender e se desenvolver com dignidade. Nesse sentido, considero a equidade fundamental, pois nem todos precisam necessariamente dos mesmos recursos ou estratégias, mas de condições adequadas às suas necessidades para que tenham oportunidades realmente justas. Portanto, inclusão e equidade caminham juntas na construção de uma sociedade mais democrática, respeitosa e acessível.","O respeito às diferenças, a equidade, a acessibilidade e a garantia da participação de todos.","Eu relacionaria “O Perigo de uma História Única” com a inclusão porque a conferência mostra a importância de respeitar as diferenças e não julgar as pessoas por estereótipos. Na educação, isso significa conhecer e valorizar a história de cada aluno, entendendo que cada pessoa é diferente e merece ser respeitada e incluída.","Sim, já respondi.","21.0","Mulher","Pedagogia","2026.2","Não","Não","","","O filme Wicked pode ser relacionado ao tema da inclusão a partir da forma como apresenta a diferença, o preconceito e a exclusão. Elphaba é vista como diferente por causa de sua aparência e, por isso, é julgada antes mesmo que as pessoas conheçam quem ela realmente é. A história mostra como uma característica pode ser usada pela sociedade para colocar alguém em uma posição de inferioridade.\nEssa relação também nos faz pensar que muitas vezes o problema não está na pessoa, mas nas barreiras criadas ao seu redor. O preconceito, os julgamentos e a falta de respeito podem fazer com que alguém não se sinta pertencente a determinado espaço. Na educação, isso é ainda mais importante, pois incluir não significa apenas permitir que o estudante esteja dentro da escola. É preciso garantir que ele seja respeitado, ouvido, participe e tenha suas diferenças reconhecidas.\nAssim, Wicked nos leva a refletir que a inclusão começa quando deixamos de enxergar a diferença como um problema. O filme mostra que, quando uma pessoa é definida apenas por aquilo que a torna diferente, sua história, suas capacidades e sua voz acabam sendo ignoradas. Por isso, pensar em uma educação inclusiva é também pensar em uma escola que não tente padronizar os sujeitos, mas que reconheça as diferenças e crie espaço para que todos possam pertencer.","1","1"],["Lucas","","","","","","","","","","Não, esta é a primeira vez.","24.0","Homem","Ciencias Contabeis","2026.2","Não","Sim. Auxiliar de escritorio","Inclusão é garantir que todas as pessoas tenham os mesmos direitos, oportunidades e respeito, independentemente de suas diferenças.","Respeito às diferenças, igualdade de oportunidades, acessibilidade e valorização da diversidade.","O filme Wicked mostra como o preconceito e a exclusão podem afetar pessoas que são vistas como diferentes pela sociedade.","0","1"],["Luna","19.0\n\n---\n\n24 anos","Mulher","Pedagogia","2 período\n\n---\n\n8º período","Não","Não","o respeito às diferenças e a igualdade de oportunidades para todas as pessoas, indo além da simples presença física.\n\n---\n\nEu compreendo a inclusão como um processo que envolve muito mais do que garantir a presença de uma pessoa em determinado espaço. Na educação, acredito que incluir significa oferecer condições para que todos os estudantes possam participar, aprender, interagir e se sentir parte da escola, respeitando suas características e necessidades. Cada pessoa possui uma história, uma forma de aprender e diferentes experiências, por isso considero importante que essas particularidades sejam reconhecidas no cotidiano escolar. Também entendo que a inclusão exige mudanças nas atitudes e nas práticas pedagógicas, para que as diferenças não sejam vistas como um problema, mas como parte da diversidade existente na sociedade. Para mim, uma escola inclusiva é aquela que procura criar possibilidades para que ninguém seja excluído ou tenha sua capacidade limitada pelos preconceitos ou pelas barreiras existentes no ambiente escolar.","Garantia de acesso universal, a valorização da diversidade e a adaptação do ambiente escolar para todas as pessoas.\n\n---\n\nNa minha perspectiva, alguns princípios são fundamentais para que a educação realmente seja inclusiva, como o respeito às diferenças, a igualdade de direitos, a equidade, a valorização da diversidade e o acolhimento. Também considero essencial a participação de todos os estudantes nas atividades escolares, com as adaptações necessárias para que cada um possa desenvolver suas potencialidades. O professor possui um papel importante nesse processo, principalmente ao buscar compreender as necessidades de seus alunos e pensar em diferentes maneiras de ensinar. Além disso, acredito que a inclusão não deve ser uma responsabilidade apenas do professor, mas de toda a comunidade escolar. É necessário construir um ambiente em que as diferenças sejam respeitadas e em que os estudantes não sejam tratados de forma inferior por apresentarem alguma dificuldade ou necessidade específica. Dessa forma, a escola pode se tornar um espaço mais democrático, acessível e acolhedor.","O problema é que as pessoas querem tratar as pessoas com deficiência pela sua deficiência e não por quem ela é.\n\n---\n\nEu relaciono a conferência “O Perigo de uma História Única” com a inclusão porque Chimamanda chama atenção para o perigo de conhecermos apenas uma versão sobre determinada pessoa ou grupo e, a partir dela, construirmos uma visão limitada. Na educação, acredito que isso acontece quando um estudante passa a ser definido somente por uma característica, como sua deficiência, uma dificuldade de aprendizagem, seu comportamento ou até mesmo sua condição social. Quando isso ocorre, deixamos de perceber todas as outras dimensões que fazem parte da vida daquele aluno. Para mim, compreender essa relação é importante porque a inclusão também depende da maneira como olhamos para o outro. É preciso conhecer suas experiências, ouvir sua história e reconhecer suas capacidades, sem permitir que um único aspecto determine a forma como ele será tratado. Assim, ampliar nosso olhar sobre os estudantes contribui para combater estereótipos, preconceitos e formas de exclusão, favorecendo uma convivência baseada no respeito e na valorização das diferenças.","Sim, já respondi.","24 anos","Mulher","Pedagogia","8º período","Não possuo","não atuo","","","Ao relacionar Wicked com a inclusão, percebo que o filme vai além de mostrar alguém que sofre preconceito por ser diferente. Para mim, ele provoca uma reflexão sobre quem determina o que é considerado normal, aceitável ou adequado dentro de uma sociedade. Elphaba é julgada por sua aparência, mas o problema não está nela ou em sua diferença, e sim na maneira como as pessoas constroem uma imagem negativa sobre aquilo que foge do padrão. O filme também mostra como determinados discursos podem transformar alguém em um problema e fazer com que sua exclusão pareça justificável.\n\nEssa questão me faz pensar criticamente sobre a inclusão no espaço escolar. Muitas vezes, falamos que a escola é inclusiva porque o estudante está matriculado e frequenta as aulas, mas isso não significa necessariamente que ele esteja participando, sendo ouvido e tendo suas necessidades consideradas. Quando a escola espera que todos aprendam, participem e se comportem da mesma maneira, acaba colocando sobre o próprio estudante a responsabilidade de se adaptar. Nesse sentido, Wicked me faz refletir que a verdadeira inclusão exige questionar padrões e práticas que produzem exclusão. Mais do que aceitar quem é diferente, é necessário reconhecer as barreiras presentes no próprio ambiente e compreender que todos devem ter condições reais de participar e ser reconhecidos por suas possibilidades, e não definidos apenas por aquilo que os diferencia.","2","1"],["Lygia","20.0","Mulher","Pedagogia","2.0","Não","Sim. Com consórcio","Que devemos sempre tentar incluir a todos","Ter atividades que envolva a todos, e que todos possam participar","Que vimos apenas um lado da história. Criamos esteriótipos sobre uma pessoa que precisa de inclusão, como um deficiente e eles são excluídos","","","","","","","","","","","1","0"],["Megara","43.0","Mulher","Pedagogia","1.0","Não","Não","Incluir",".",".","","","","","","","","","","","1","0"],["Merida","25.0","Mulher","Pedagogia","6 período","Não","Sim, auxiliar de sala","Que ainda é um tópico que precisa ser desenvolvido com mais profundidade na sociedade.","O respeito e a valorização do outro como pessoa integrada na comunidade .","A narrativa tem grande associação com a exclusão social diante da raça e etnia na discursão da autora, o que evidencia grande problemática.","","","","","","","","","","","1","0"],["Minerva","32.0","Mulher","Pedagogia","4.0","Sim. Ciências sociais","Sim","Penso que todos tem ué viver de forma equidade","..","..","","","","","","","","","","","1","0"],["Moana","26.0","Mulher","Pedagógia","Sexto","Não","Não","Respeita as limitações e dá apoio.","Receptividade,observação, atitude respeitosa que condiz com o ambiente","Vivência","","","","","","","","","","","1","0"],["Musa","20.0","Mulher","Pedagogia","2026.2","Nao","Fabricação de joia","Pra mim, inclusão é entender que ninguém é igual. Cada ser humano tem uma história diferente, uma luta diferente, um obstáculo diferente. A dor que o outro sente não é a mesma que a minha, e a dificuldade dele não é menor só porque eu não vivo ela. Incluir é respeitar isso","Saber a diferença entre equidade e igualdade\nHumanização da parte dos mediadores, ser mais humano, mais Gentil \nAlém de empatia","A gente tem a mania de achar que conhece alguém, um povo ou um lugar porque ouviu apenas uma versão sobre ele. A partir de uma única história, criamos um padrão, um estereótipo, e passamos a enxergar o outro através dele. Mas o estereótipo não é uma mentira, ele é uma história incompleta. Ele mostra uma parte, mas esconde todas as outras. Ele nos faz acreditar que sabemos a verdade, quando na verdade nunca perguntamos se existe uma outra versão, algo mais profundo e escondido por tras daquele rótulo. A exclusão nasce exatamente aí: quando acreditamos que só existe uma verdade possível sobre o outro. Incluir, então, é ter a humildade de entender que nenhuma pessoa cabe dentro de uma história só","","","","","","","","","","","1","0"],["Nara","25.0","Mulher","Pedagogia","6.0","Não","Sim, estágio","E necessária","Um que apoie e respeite os direitos de todos","Que não podemos olhar de uma única pespecitiva as coisas ao nosso redor.","","","","","","","","","","","1","0"],["Natasha","18.0","Mulher","Pedagogia","2°","Não","Não","Entendo que devo respeitar, e que uma pessoa não é definida e nem deve ser inferiorizada devido a sua condição.","Entender e respeitar, ensinar mais sobre essas condições.","Aprender sobre a nossa cultura e que não devemos generalizar um povo, assim como não devemos generalizar e nem identificar pessoas com deficiência apenas pela sua condição.","","","","","","","","","","","1","0"],["Nessa","","","","","","","","","","Não, esta é a primeira vez.","26.0","Mulher","Pedagogia","2026.2","Não","Não","Inclusão é garantir que todas as pessoas tenham os mesmos direitos, oportunidades e sejam respeitadas, independentemente de suas diferenças.","Respeito às diferenças, igualdade de oportunidades, acolhimento, participação de todos e valorização de cada aluno.","O filme mostra como uma pessoa pode ser excluída e julgada por ser diferente. Isso se relaciona com a inclusão, pois devemos respeitar as diferenças e combater o preconceito.","0","1"],["Nina","","","","","","","","","","Não, esta é a primeira vez.","20.0","Mulher","Pedagogia","2026.2","Não","Não","A inclusão diz respeito a  buscar formas de integrar seja na educação ou em outro campo pessoas que tem alguma especificidade, ou necessidade física, neurológica e etc.","Respeito, empatia,acolhimento","Incluir o outro seria enxergar suas diferenças sem julgamentos ou preconceitos","0","1"],["Nymphadora","19.0","Mulher","Pedagogia","2 período","Não","Não","Minha concepção é que se deve ser algo pertinente nas salas é obrigatório nas escolas. Para assim haver uma mudança","Entendermos a si mesmo primeiro, antes mesmo de querermos falar sobre esse assunto, conhecimento e entre outros","A questão de como as histórias são contas e muitas vezes vistas pelos outros, por exemplo com uma pessoa neurodivergente quando tratam apenas como um neurodivergente e não como a pessoa em si!","","","","","","","","","","","1","0"],["Não precisa","","","","","","","","","","Sim, já respondi.","20 anos","Homem","Pedagogia","4º período","não","Atualmente, atuo como Monitor Educacional","","","O filme traz uma relação muito forte com o preconceito e discriminação com pessoas que não fazem parte de um “padrão” definido pela sociedade, ou seja, excluindo as diferenças e silenciando essas pessoas. A personagem principal, a garota verde que não me recordo o nome, remete claramente esse processo de exclusão que mencionei. O mesmo se dá aos animais falantes que vivem nessa fantasia.","0","1"],["Não sei","","","","","","","","","","Não, esta é a primeira vez.","20.0","Mulher","Pedagogia","4 período","Não","Feirante","Inclusão é incluindo outras pessoas","Mais acolhimento","Uma relação de se aceitar e de ser aceita por outros","0","1"],["Ponta","21.0","Mulher","Pedagogia","4°","Não","Não",".",".",".","","","","","","","","","","","1","0"],["Ponta2","20.0","Mulher","Pedagogia","Oitavo período","Não","Não","Isso","Aquilo","Por isso","","","","","","","","","","","1","0"],["Rapunzel","19 anos\n\n---\n\n20.0","Mulher","Pedagogia","4 período\n\n---\n\n8°","Não","Não\n\n---\n\nsim, pedagoga","Inclusão é uma forma de unir as pessoas, independentes de fatores que envolvem diferenças.\n\n---\n\nInclusão pra mim é garantir que toda criança pertença e aprenda, não só esteja na sala.\nNão é só inserir o aluno com deficiência, é adaptar a aula, o espaço e o olhar para que cada um - com sua diferença de ritmo, cultura ou necessidade - tenha oportunidade real de participar e desenvolver-se.\nÉ equidade: não dar o mesmo para todos, mas dar o que cada um precisa para aprender junto.","Empatia, respeito as diferenças, sensibilidade e igualdade.\n\n---\n\n1. Pertencimento, não só presença. 2. Equidade. 3. Acessibilidade em tudo. 4. Olhar para a potencialidade.","Que a inclusão ela é um tema que nos leva a uma descoberta sobre não só o outro, como também nós mesmos, nossas histórias e trajetória. Para acabar com essas ideias estereotipadas, descobrir as pessoas como elas são e não uma limitação somente\n\n---\n\nA relação é direta.\nChimamanda mostra que quando contamos só uma história sobre alguém, nós o reduzimos e o estereotipamos.\nNa inclusão acontece o mesmo: A escola muitas vezes conta uma história única sobre o aluno: “o laudo\", \"o que ele não sabe fazer\", \"o aluno que dá trabalho\".\nQuando a gente só conta essa história, a gente esquece que aquela criança tem muitas outras histórias: o que ela gosta, onde ela é boa, sua família, sua cultura, sua forma de aprender.\nA educação inclusiva é justamente quebrar o perigo da história única. É trocar o:\n\"O autista da sala\" por \"o João, que ama dinossauros, que é autista e está aprendendo a ler\".\nIncluir é garantir que a criança possa contar a sua história completa, e não ser resumida a uma só.","","","","","","","","","","","2","0"],["Ric","23.0","Homem","Pedagogia","2026.2","Não","Em nada","Minha compreensão sobre o assunto é pouco, mas sei q é super importante por experiência própria tinha um amigo que era surdo e era difícil se comunicar com ele pois não sabíamos libras.","Um profissional capacitado e uma infraestrutura nos centros de ensino.","Os estereótipos de que pessoas PCD são incapazes de de estudar, namorar e ter uma carreira de sucesso.","","","","","","","","","","","1","0"],["Ricz","","","","","","","","","","Sim, já respondi.","24.0","Homem","Pedagogia","2026.2","Não","Não","","","Em Wicked, a inclusão aparece na trajetória de Elphaba, que, mesmo sendo diferente e inicialmente excluída por sua pele verde, passa a ocupar espaços e construir relações com outras pessoas, especialmente com Glinda. A história mostra que incluir é dar espaço, respeitar as diferenças e não excluir alguém por sua aparência ou por não seguir os padrões sociais.","0","1"],[ elação do princípio da não descriminação porque o defeito não está nela por ser verde ,mas sim nas pessoas e suas atitudes","0","1"],["Silena","20.0","Mulher","Licenciatura-matemática","2026.2","Não","Não","Muito importante para os discentes e docentes","Reflexão e manter a equidade analisando sempre suas necessidades específica","Apesar de qualquer dificuldade, todos podem ser o que quiser e fazer como quiser","","","","","","","","","","","1","0"],["Sky","19.0","Homem","Matemática\n\n---\n\nPedagogia","4 período\n\n---\n\n2026.2","Não","Não","Trata as pessoas com igualdade independente de suas diferenças\n\n---\n\nPois bem, a inclusão deve assegurar os direitos a todos de forma com que cada pessoa tenha sua necessidade atendida.","A Equidade\n\n---\n\nRespeito , enpatia e responsabilidade","Buscar entender a história de cada um\n\n---\n\nDe que ao adotar uma única história , nós excluímos todas as outras, as quais devem ser representadas e respeitadas por quem faz parte dos mesmos.","","","","","","","","","","","2","0"],["Sol","25.0","Mulher","Física","11.0","Não","Não","Fazer com que todos tenham as mesmas oportunidades independente do lugar onde veio, possíveis deficiências etc...","Preparo durante a formação, empatia, conhecimento.","A história única exclui porque reduz o indivíduo a uma característica. A inclusão amplia as histórias, reconhece a diversidade e permite que cada pessoa seja vista em sua totalidade.","Sim, já respondi.","24.0","Mulher","Física","11.0","Não","Não","","","A Elphaba é excluída principalmente por ser diferente: ela tem a pele verde e, por isso, é tratada como alguém estranha, inferior ou indesejável. Isso faz com que ela seja constantemente julgada antes que as pessoas conheçam quem ela realmente é.","1","1"],["Stella","19.0","Mulher","Matemática licenciatura","Quarto período","Não","Diarista","Direito de estar em todo e qualquer meio social mesmo se possuir diferença dos demais","Acessibilidade e equidade","Entender as necessidades <script>
function normalize(value){return String(value??'').normalize('NFKC').trim().toLocaleLowerCase('pt-BR')}
const sheet=JSON.parse(document.querySelector('#embedded-data').textContent)[0].sheets[0];
const rows=sheet.rows.filter(Boolean),headers=rows[0]||[],data=rows.slice(1),pseudonymIndex=headers.findIndex(name=>normalize(name)==='pseudônimo'),hidden=new Set(headers.map((_,i)=>i).filter(i=>i!==(pseudonymIndex<0?0:pseudonymIndex))),filters=new Set(),widths=Array(headers.length).fill(220);
const columns=document.querySelector('#columns'),table=document.querySelector('#table');
function draw(){
 columns.replaceChildren();
 headers.forEach((name,i)=>{
  const option=document.createElement('div');option.className='column-option'+(hidden.has(i)?' off':'');
  const top=document.createElement('label');top.className='column-option-top';const show=document.createElement('input');show.type='checkbox';show.checked=!hidden.has(i);show.onchange=()=>{show.checked?hidden.delete(i):hidden.add(i);draw()};top.append(show,document.createTextNode(name));
  const filter=document.createElement('label');filter.className='nonempty-filter';const filled=document.createElement('input');filled.type='checkbox';filled.checked=filters.has(i);filled.title='Mostrar somente linhas preenchidas nesta coluna';filled.onchange=()=>{filled.checked?filters.add(i):filters.delete(i);draw()};filter.append(filled,document.createTextNode('Com conteúdo'));
  option.append(top,filter);columns.append(option)
 });
 const visible=headers.map((_,i)=>i).filter(i=>!hidden.has(i));
 const matches=data.map((row,index)=>({row,index})).filter(({row})=>[...filters].every(i=>String(row[i]??'').trim()!==''));
 table.replaceChildren();if(!visible.length||!matches.length)return;
 const tracks=()=>visible.map(i=>widths[i]+'px').join(' '),root=document.createElement('div');root.className='sheet-grid';root.style.setProperty('--columns',tracks());root.style.setProperty('--print-columns',visible.map(i=>`minmax(0, ${Math.max(1,widths[i])}fr)`).join(' '));
 const head=document.createElement('div');head.className='header-grid';visible.forEach(i=>{const cell=document.createElement('div');cell.className='header-cell';cell.textContent=headers[i];const grip=document.createElement('div');grip.className='column-resizer';grip.title='Arraste para ajustar a largura';grip.setAttribute('role','separator');grip.setAttribute('aria-orientation','vertical');grip.onpointerdown=e=>{e.preventDefault();const x=e.clientX,start=widths[i];grip.classList.add('dragging');grip.setPointerCapture(e.pointerId);grip.onpointermove=ev=>{widths[i]=Math.max(120,start+ev.clientX-x);root.style.setProperty('--columns',tracks())};grip.onpointerup=()=>{grip.classList.remove('dragging');grip.onpointermove=null;grip.onpointerup=null}};cell.append(grip);head.append(cell)});root.append(head);
 const list=document.createElement('div');list.className='records';matches.forEach(({row,index})=>{
  const record=document.createElement('article');record.className='record';record.setAttribute('aria-label','Resposta '+(index+1));
  const content=document.createElement('div');content.className='record-grid';visible.forEach(i=>{const cell=document.createElement('div');cell.className='record-cell';cell.dataset.label=headers[i];const box=document.createElement('div');box.className='cellbox';const value=String(row[i]??''),text=document.createElement('div');text.className='value';text.textContent=value;box.append(text);if(value){const copy=document.createElement('button');copy.className='copy';copy.textContent='Copiar';copy.onclick=()=>copyText(value,copy);box.append(copy)}cell.append(box);content.append(cell)});record.append(content);
  const footer=document.createElement('div');footer.className='record-footer';const copyRow=document.createElement('button');copyRow.className='copy-row';copyRow.textContent='Copiar linha';copyRow.onclick=()=>{const text=visible.map(i=>headers[i]+': '+String(row[i]??'')).join('\n');copyText(text,copyRow)};footer.append(copyRow);record.append(footer);list.append(record)
 });root.append(list);table.append(root)
}
async function copyText(text,button){try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();document.execCommand('copy');area.remove()}const old=button.textContent;button.textContent='Copiado';setTimeout(()=>button.textContent=old,1000)}
draw();document.querySelector('#all').onclick=()=>{hidden.clear();draw()};document.querySelector('#print').onclick=()=>window.print();
</script></body></html>
